<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advent · Preparing Our Hearts</title>
<meta name="description" content="A 30-day Advent devotional journey of Scripture, reflection, and prayer to prepare our hearts for the coming of Christ.">
<meta property="og:type" content="website">
<meta property="og:title" content="Advent · Preparing Our Hearts">
<meta property="og:description" content="30 days of Scripture, reflection, and prayer to prepare our hearts for the coming of Christ.">
<meta property="og:site_name" content="Real Life Christian Communities">
<meta property="og:image" content="https://rlccphil.github.io/advent/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://rlccphil.github.io/advent/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#f7f5ec;--card:#fff;--ink:#2b2d2a;--mute:#666b63;--gold:#b8872e;--navy:#365233;--line:#e3e1d0}
@media(prefers-color-scheme:dark){:root{--bg:#121a12;--card:#1a251a;--ink:#ece8dc;--mute:#a5b0a2;--gold:#e0b04f;--navy:#b9d9b2;--line:#2b3b2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
.brand{background:#365233;margin:-20px -16px 14px;padding:18px 16px;text-align:center;border-radius:0 0 14px 14px}
.brand img{display:block;margin:0 auto;width:min(260px,70%);height:auto}
header{text-align:center;padding:8px 0}
h1{margin:0;font-size:1.65rem;color:var(--navy)}
.sub{color:var(--mute);font-size:.95rem}
.candles{display:flex;justify-content:center;gap:16px;margin:18px 0 8px;padding-top:12px}
.c{width:10px;height:34px;background:var(--line);border-radius:2px;position:relative}
.c.on{background:var(--gold)}
.c.on:before{content:"";position:absolute;left:1px;top:-12px;width:8px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#f5c04a;box-shadow:0 0 10px #f5c04a}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px}
.wk{color:var(--gold);font:600 .8rem/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.date{color:var(--mute);font-size:.92rem;margin-top:2px}
h2{margin:6px 0 10px;font-size:1.4rem;color:var(--navy)}
h3{margin:22px 0 6px;font:600 .8rem/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.scr{background:var(--bg);border-left:3px solid var(--gold);border-radius:6px;padding:12px 14px;margin:10px 0}
.scr b{display:block;color:var(--navy);margin-bottom:4px}
.txt{white-space:pre-line}
.cp{display:block;color:var(--mute);font-size:.75rem;line-height:1.4;margin-top:8px}
.pr{font-style:italic}
.note{background:var(--bg);border:1px dashed var(--gold);border-radius:8px;padding:10px 12px;color:var(--mute);font-size:.92rem;margin-top:12px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:14px;font-family:system-ui,sans-serif}
button,select{font:600 .9rem system-ui,sans-serif;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer}button:disabled{opacity:.4}
.visit{text-align:center;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);color:var(--mute);font-size:.95rem}
.btn{display:inline-block;background:#365233;color:#fff;text-decoration:none;font:600 .95rem system-ui,sans-serif;padding:12px 22px;border-radius:999px;border:1px solid #365233}
.btn:hover{background:#2b4229}
@media(prefers-color-scheme:dark){.btn{background:#4b6e47;border-color:#4b6e47}.btn:hover{background:#5a8355}}
.grp{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.grp summary{cursor:pointer;font:600 .8rem/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.grp ol{margin:10px 0 0;padding-left:22px}.grp li{margin-bottom:8px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button.btn{cursor:pointer}
.btn.btn2{background:transparent;color:var(--navy);border-color:var(--navy)}
.btn.btn2:hover{background:var(--bg)}
.lnk{background:none;border:none;color:var(--mute);text-decoration:underline;font:400 .85rem system-ui,sans-serif;padding:4px 8px;cursor:pointer}
.dots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:16px}
.dots button{padding:8px 0;font-size:.8rem}
.dots .cur{background:var(--navy);color:var(--bg);border-color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">
 <div class="brand"><a href="https://www.rlcc.ph" target="_blank" rel="noopener"><img src="rlcc-logo.png" alt="Real Life Christian Communities"></a></div>
 <header>
  <h1 id="h1">Advent</h1>
  <div class="sub">30 days to prepare our hearts for the coming of Christ</div>
  <div class="candles" id="candles"></div>
 </header>
 <div id="pre" class="note" hidden></div>
 <div class="card" id="card"></div>
 <div class="bar">
  <button id="prev">← Previous</button>
  <button id="today">Today</button>
  <button id="next">Next →</button>
 </div>
 <div class="bar"><label for="tr" class="sub">Bible translation</label>
  <select id="tr"><option value="NIV">NIV</option><option value="NASB">NASB</option><option value="MSG">The Message</option></select>
 </div>
 <div class="dots" id="dots"></div>
 <p style="text-align:center;margin:14px 0 0"><button class="lnk" id="wl">Welcome page</button></p>
 <div class="visit">
  <p>Looking for a community to walk with this Christmas season? We'd love to meet you.</p>
  <a class="btn" href="https://www.rlcc.ph" target="_blank" rel="noopener">Visit Real Life Christian Communities</a>
 </div>
</div>
<script src="config.js"></script>
<script src="days.js"></script>
<script src="groups.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycby3AHCMbDHXS_r0waMPX7-8OwI6z5dq4bObK_X41cda0ocxT4-bElsm_3VsrBL2FE5hdQ/exec";
const W=[["Hope","The Promise"],["Peace","Prepare the Way"],["Joy","Good News"],["Love","God with Us"]];
const START=CONFIG.start?new Date(CONFIG.start[0],CONFIG.start[1]-1,CONFIG.start[2]):new Date(CONFIG.year,10,26);
const END=new Date(START.getFullYear(),START.getMonth(),START.getDate()+DAYS.length-1);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tr="NIV";try{tr=localStorage.getItem("advTr")||"NIV"}catch(e){}
$("tr").value=tr;
$("h1").textContent="Advent "+CONFIG.year;document.title="Advent "+CONFIG.year+" · Preparing Our Hearts";
const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
const rawI=Math.round((t0-START)/864e5);
const todayI=rawI<0?-1:(rawI>=DAYS.length?DAYS.length:rawI);
let i=todayI,tok=0;const cache={};
const dateOf=k=>new Date(START.getFullYear(),START.getMonth(),START.getDate()+k).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});

function render(){
 const L=DAYS.length,pre=$("pre");pre.hidden=!(i>=0&&i<L&&(t0<START||t0>END));
 pre.textContent=t0>END?"This year's journey has ended. You are welcome to revisit it anytime, and we hope to journey with you again next Advent.":"This journey begins on "+START.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})+". You are welcome to look ahead!";
 $("candles").innerHTML=[1,2,3,4].map(k=>'<div class="c'+(k<=(i<0?0:i>=L?4:DAYS[i].w)?" on":"")+'"></div>').join("");
 if(i<0||i>=L){page(i<0);return}
 const d=DAYS[i],w=d.w-1;
 const lab=d.w?'Week '+d.w+' · '+W[w][0]+': '+W[w][1]:'Getting Ready';
 let h='<div class="wk">'+lab+'</div><div class="date">Day '+(i+1)+' of '+DAYS.length+' · '+dateOf(i)+'</div><h2>'+esc(d.t)+'</h2>';
 h+='<h3>Scripture</h3><div id="scr"></div>';
 if(d.b){
  h+='<h3>Reflection</h3>'+d.b.map(p=>'<p>'+esc(p)+'</p>').join('');
  h+='<h3>Pause and Ponder</h3><p>'+esc(d.q)+'</p>';
  h+='<h3>Prayer</h3><p class="pr">'+esc(d.p)+'</p>';
  h+='<h3>Today\'s Practice</h3><p>'+esc(d.a)+'</p>';
 }else h+='<div class="note">The reflection for this day is on its way. In the meantime, read the passage slowly and ask: What does this tell me about who Jesus is and why he came?</div>';
 if(typeof GROUP!=="undefined"&&GROUP[i])h+='<details class="grp"><summary>Small group discussion</summary><ol>'+GROUP[i].map(q=>'<li>'+esc(q)+'</li>').join("")+'</ol></details>';
 $("card").innerHTML=h;
 nav();load();scrollTo(0,0);
}
function nav(){
 $("prev").disabled=i<=-1;$("next").disabled=i>=DAYS.length;
 $("dots").innerHTML=DAYS.map((_,k)=>'<button data-k="'+k+'"'+(k===i?' class="cur"':'')+' aria-label="Day '+(k+1)+'">'+(k+1)+'</button>').join("");
}
function share(){
 const u=location.href.split("#")[0],t="Preparing Our Hearts: a 30-day Advent journey";
 if(navigator.share){navigator.share({title:t,text:t,url:u}).catch(()=>{})}
 else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>alert("Link copied. Share it with a friend!"),()=>prompt("Copy this link:",u))}
 else prompt("Copy this link:",u);
}
function page(welcome){
 const f=d=>d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
 tok++;
 $("card").innerHTML=welcome?`<div class="wk">Welcome</div><h2>Preparing Our Hearts for Christmas</h2>
<p>Welcome, and thank you for joining us. For the next 30 days, from ${f(START)} to ${f(END)}, we will slow down together and prepare our hearts for the coming of Jesus Christ. Each day offers a short Scripture reading, a brief reflection, a prayer, and one simple practice, and it takes only a few minutes.</p>
<h3>Journey with Others</h3>
<p>We were made for community, and this journey is richer when it is shared. Jesus promised to be present wherever two or three gather in his name (Matthew 18:20). So we warmly encourage you not to walk through these days alone. Invite your family, a friend, a coworker, or your small group to read along with you. Share what you are learning, pray for one another, and use the three discussion questions at the bottom of each day to start good conversations.</p>
<h3>How It Works</h3>
<p>The first two days help us get ready. Then four weeks follow, built around Hope, Peace, Joy, and Love, leading us to Christmas Day. You can read the Scripture in the NIV, NASB, or The Message. If you miss a day, don't worry. There is grace, so simply pick up where you can.</p>
<p>May God meet you in his Word and draw you closer to Christ over these days.</p>
<div class="acts"><button class="btn" data-a="go">Begin Day 1 →</button><button class="btn btn2" data-a="share">Invite a friend</button></div>`
 :`<div class="wk">Journey Complete</div><h2>Congratulations!</h2>
<p>You have completed all ${DAYS.length} days of this Advent journey. Well done! Day after day, you took time to slow down, open God's Word, and make room for Jesus, and that is worth celebrating. Thank you for walking this road, and thank you to everyone who journeyed with you.</p>
<p>The One we have been preparing for has come. A Savior has been born for you, and one day he will come again. Philippians 1:6 reminds us that the God who began a good work in you will carry it on to completion until the day of Christ Jesus. This is not the end of your journey with him, only a good beginning.</p>
<h3>Looking Back</h3>
<p>Take a few moments to reflect. What has God taught you over these days? Where have you seen him at work? Share one thing with someone who journeyed with you, or with someone who hasn't yet.</p>
<h3>Moving Forward</h3>
<p>Keep the rhythm going: a little Scripture, a little prayer, and a heart ready for him each day. And if you are looking for a community to grow with, we would love to meet you.</p>
<p><em>Merry Christmas from all of us at Real Life Christian Communities!</em></p>
<div class="acts"><button class="btn" data-a="go">Revisit Day 1</button><button class="btn btn2" data-a="share">Share this journey</button></div>`;
 nav();scrollTo(0,0);
}


async function get(id){
 const k=tr+id;if(cache[k])return cache[k];
 const r=await fetch(API+"?bible="+encodeURIComponent(tr)+"&ref="+encodeURIComponent(id));
 const j=await r.json();if(j.ok)cache[k]=j;return j;
}
function fums(d){
 if(!d.fumsId)return;
 const go=()=>{try{window._BAPI&&_BAPI.t(d.fumsId)}catch(e){}};
 if(window._BAPI&&_BAPI.t)return go();
 if(d.fumsJsInclude){const s=document.createElement("script");s.src=d.fumsJsInclude.indexOf("//")===0?"https:"+d.fumsJsInclude:d.fumsJsInclude;s.onload=go;document.head.appendChild(s)}
}
async function load(){
 if(i<0||i>=DAYS.length)return;
 const my=++tok,d=DAYS[i],box=$("scr");
 for(const id of d.r){
  const el=document.createElement("div");el.className="scr";el.textContent="Loading…";box.appendChild(el);
  try{
   const j=await get(id);if(my!==tok)return;
   if(!j.ok)throw 0;
   el.innerHTML='<b>'+esc(j.reference)+' ('+esc($("tr").selectedOptions[0].text)+')</b><div class="txt"></div><span class="cp"></span>';
   el.querySelector(".txt").textContent=(j.text||"").trim();
   el.querySelector(".cp").textContent=j.copyright||"";
   fums(j);
  }catch(e){if(my!==tok)return;el.innerHTML='<b>'+esc(d.ref)+'</b>We couldn\'t load the passage right now. Please read it in your own Bible.'}
 }
}
$("prev").onclick=()=>{if(i>0){i--;render()}};
$("next").onclick=()=>{if(i<DAYS.length-1){i++;render()}};
$("today").onclick=()=>{i=todayI;render()};
$("dots").onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k!=null){i=+k;render()}};
$("tr").onchange=e=>{tr=e.target.value;try{localStorage.setItem("advTr",tr)}catch(x){}load()};
$("wl").onclick=()=>{i=-1;render()};
$("card").onclick=e=>{const a=e.target.dataset&&e.target.dataset.a;if(a==="go"){i=0;render()}else if(a==="share")share()};
render();
</script>
</body>
</html>
